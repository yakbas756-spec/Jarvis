<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#050a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a12;--panel:#0a1522;--line:#17324a;--cy:#5ee1ff;--am:#ffb347;--tx:#d3ecf7;--dim:#6f93a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Helvetica Neue",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 22%,#0b2236 0%,var(--bg) 62%)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
h1{font:600 18px "Chakra Petch",sans-serif;letter-spacing:.32em;color:var(--cy)}
#status{font:13px "Chakra Petch",sans-serif;color:var(--dim)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#stage{flex:0 0 38%;min-height:190px;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
#log{flex:1;overflow-y:auto;padding:6px 18px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.m{max-width:88%;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.u{align-self:flex-end;border-color:#3b2c14;background:#17110a;color:#ffe3b8}
.j{align-self:flex-start}
.t{align-self:flex-start;font:13px "Chakra Petch",sans-serif;color:var(--dim);border:none;background:none;padding:0 4px}
form{display:flex;gap:8px;padding:8px 14px 12px}
input{flex:1;font:16px inherit;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#mic{width:48px;border-color:var(--cy);color:var(--cy)}
#mic.on{background:var(--cy);color:var(--bg)}
dialog{margin:auto;width:min(92vw,420px);background:var(--panel);color:var(--tx);border:1px solid var(--cy);border-radius:16px;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog label{display:block;margin:12px 0 4px;color:var(--dim);font-size:14px}
dialog input{width:100%}
dialog p{font-size:14px;color:var(--dim)}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><h1>JARVIS</h1><span id="status">bereit</span><button id="cfg" aria-label="Einstellungen">Einstellungen</button></header>
<div id="stage"><canvas id="orb"></canvas></div>
<div id="log" aria-live="polite"></div>
<form id="f"><button type="button" id="mic" aria-label="Sprechen">●</button><input id="in" placeholder="Sag oder schreib etwas …" autocomplete="off"></form>

<dialog id="dlg">
<h2 style="font:600 17px 'Chakra Petch',sans-serif;color:var(--cy)">Einstellungen</h2>
<label for="key">Gemini-API-Key (kostenlos bei aistudio.google.com)</label>
<input id="key" type="password" autocomplete="off">
<label for="model">Modell</label>
<input id="model" value="gemini-2.5-flash">
<label for="city">Standard-Stadt für das Wetter</label>
<input id="city" placeholder="z. B. Berlin">
<p style="margin-top:12px">Der Key bleibt nur auf diesem Gerät gespeichert.</p>
<div class="row"><button id="clr">Verlauf löschen</button><button id="save" style="border-color:var(--cy);color:var(--cy)">Speichern</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const S=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
const W=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let state="idle",amp=0,history=[];
const SYS="Du bist JARVIS, ein souveräner, trockener und freundlicher KI-Butler. Antworte immer auf Deutsch, kurz und gesprochen natürlich (maximal 3 Sätze, keine Listen, kein Markdown). Nutze Werkzeuge, wenn sie helfen. Wenn dir etwas fehlt, sag es ehrlich.";

/* ---------- Orb ---------- */
const cv=$("orb"),cx=cv.getContext("2d");let w,h,dpr;
function fit(){dpr=devicePixelRatio||1;w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",fit);fit();
function draw(t){
  t/=1000;const target={idle:.06,listening:.35,thinking:.2,speaking:.55}[state];
  amp+=(target+(state==="speaking"||state==="listening"?Math.random()*.25*target*2:0)-amp)*.08;
  cx.clearRect(0,0,w,h);const x=w/2,y=h/2,r=Math.min(w,h)*.27;
  const col=state==="thinking"?"255,179,71":"94,225,255";
  const g=cx.createRadialGradient(x,y,r*.2,x,y,r*2.1);g.addColorStop(0,`rgba(${col},${.16+amp*.3})`);g.addColorStop(1,`rgba(${col},0)`);
  cx.fillStyle=g;cx.fillRect(0,0,w,h);
  for(let i=0;i<3;i++){
    cx.beginPath();const rr=r*(1+i*.2),sp=(state==="thinking"?3:.7)*(i%2?-1:1);
    cx.setLineDash(i==1?[4,10]:i==2?[60,18,6,18]:[]);cx.lineDashOffset=-t*40*sp;
    cx.strokeStyle=`rgba(${col},${.75-i*.2})`;cx.lineWidth=i==0?2:1.2;cx.arc(x,y,rr+amp*10,0,7);cx.stroke();
  }
  cx.setLineDash([]);cx.beginPath();
  for(let a=0;a<=360;a+=3){const rad=a*Math.PI/180,n=Math.sin(a*.12+t*3)*Math.sin(a*.05-t*2)*amp*r*.28,rr=r*.78+n;
    cx[a?"lineTo":"moveTo"](x+Math.cos(rad)*rr,y+Math.sin(rad)*rr)}
  cx.closePath();cx.fillStyle=`rgba(${col},${.1+amp*.25})`;cx.fill();cx.strokeStyle=`rgba(${col},.95)`;cx.lineWidth=1.6;cx.stroke();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
const labels={idle:"bereit",listening:"höre zu …",thinking:"denke nach …",speaking:"spricht"};
function setState(s){state=s;$("status").textContent=labels[s]}

/* ---------- Chat-UI ---------- */
function add(cls,txt){const d=document.createElement("div");d.className="m "+cls;d.textContent=txt;$("log").append(d);$("log").scrollTop=1e9;return d}
function tool(txt){const d=document.createElement("div");d.className="t";d.textContent="⚙ "+txt;$("log").append(d);$("log").scrollTop=1e9}

/* ---------- Sprache ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function speak(txt){
  return new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="de-DE";
    const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("de")&&/enhanced|premium|siri/i.test(v.name))||speechSynthesis.getVoices().find(v=>v.lang.startsWith("de"));
    if(v)u.voice=v;u.rate=1.02;u.onstart=()=>setState("speaking");u.onend=u.onerror=()=>{setState("idle");res()};speechSynthesis.speak(u)});
}
function listen(){
  if(!SR){add("j","Spracheingabe wird in diesem Browser nicht unterstützt. Bitte nutze Safari oder tippe.");return}
  speechSynthesis.cancel();rec=new SR();rec.lang="de-DE";rec.interimResults=true;rec.continuous=false;let fin="";
  rec.onstart=()=>{setState("listening");$("mic").classList.add("on")};
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;fin=t;$("in").value=t};
  rec.onend=()=>{$("mic").classList.remove("on");rec=null;if(fin.trim()){$("in").value="";ask(fin.trim())}else setState("idle")};
  rec.onerror=()=>{$("mic").classList.remove("on")};rec.start();
}
$("mic").onclick=()=>rec?rec.stop():listen();
cv.onclick=()=>rec?rec.stop():listen();
$("f").onsubmit=e=>{e.preventDefault();const t=$("in").value.trim();if(t){$("in").value="";ask(t)}};

/* ---------- Werkzeuge ---------- */
const decl=[
 {name:"get_time",description:"Aktuelle Uhrzeit und Datum des Geräts",parameters:{type:"OBJECT",properties:{}}},
 {name:"get_weather",description:"Aktuelles Wetter und Vorhersage für eine Stadt",parameters:{type:"OBJECT",properties:{city:{type:"STRING",description:"Stadtname"}},required:["city"]}},
 {name:"wiki_search",description:"Faktenwissen aus Wikipedia nachschlagen",parameters:{type:"OBJECT",properties:{query:{type:"STRING"}},required:["query"]}},
 {name:"calculate",description:"Mathematischen Ausdruck berechnen, z. B. 12*(3+4)",parameters:{type:"OBJECT",properties:{expression:{type:"STRING"}},required:["expression"]}},
 {name:"set_timer",description:"Timer starten",parameters:{type:"OBJECT",properties:{seconds:{type:"NUMBER"},label:{type:"STRING"}},required:["seconds"]}},
 {name:"save_note",description:"Notiz speichern",parameters:{type:"OBJECT",properties:{text:{type:"STRING"}},required:["text"]}},
 {name:"list_notes",description:"Alle gespeicherten Notizen vorlesen",parameters:{type:"OBJECT",properties:{}}},
 {name:"open_url",description:"Eine Webseite oder Suche öffnen",parameters:{type:"OBJECT",properties:{url:{type:"STRING"}},required:["url"]}}
];
const wmo=c=>c==0?"klar":c<4?"wolkig":c<49?"neblig":c<68?"Regen":c<78?"Schnee":c<83?"Schauer":"Gewitter";
const impl={
 async get_time(){const d=new Date();return{zeit:d.toLocaleTimeString("de-DE"),datum:d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}},
 async get_weather({city}){
  const g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name="+encodeURIComponent(city||S("city")))).json();
  if(!g.results)return{fehler:"Stadt nicht gefunden"};const p=g.results[0];
  const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`)).json();
  return{ort:p.name,jetzt_grad:r.current.temperature_2m,wetter:wmo(r.current.weather_code),wind_kmh:r.current.wind_speed_10m,max:r.daily.temperature_2m_max,min:r.daily.temperature_2m_min,regenwahrscheinlichkeit:r.daily.precipitation_probability_max}},
 async wiki_search({query}){
  const s=await(await fetch("https://de.wikipedia.org/w/api.php?origin=*&format=json&action=query&list=search&srlimit=1&srsearch="+encodeURIComponent(query))).json();
  const t=s.query.search[0];if(!t)return{fehler:"nichts gefunden"};
  const x=await(await fetch("https://de.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.title))).json();return{titel:t.title,text:x.extract}},
 async calculate({expression}){if(!/^[\d\s+\-*/().,%^]+$/.test(expression))return{fehler:"ungültig"};try{return{ergebnis:Function('"use strict";return ('+expression.replace(/,/g,".").replace(/\^/g,"**")+')')()}}catch(e){return{fehler:"Rechenfehler"}}},
 async set_timer({seconds,label}){setTimeout(()=>{const m="Der Timer"+(label?" „"+label+"“":"")+" ist abgelaufen.";add("j",m);speak(m)},seconds*1000);return{gestartet:seconds+" Sekunden"}},
 async save_note({text}){const n=JSON.parse(S("notes")||"[]");n.push(text);W("notes",JSON.stringify(n));return{gespeichert:true,anzahl:n.length}},
 async list_notes(){return{notizen:JSON.parse(S("notes")||"[]")}},
 async open_url({url}){if(!/^https?:\/\//.test(url))url="https://www.google.com/search?q="+encodeURIComponent(url);window.open(url,"_blank");return{geöffnet:url}}
};

/* ---------- Gehirn (Gemini) ---------- */
async function ask(text){
  const key=S("key");if(!key){add("j","Bitte trage zuerst deinen kostenlosen Gemini-Key in den Einstellungen ein.");$("dlg").showModal();return}
  add("u",text);history.push({role:"user",parts:[{text}]});setState("thinking");
  try{
    for(let i=0;i<5;i++){
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S("model")||"gemini-2.5-flash"}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({systemInstruction:{parts:[{text:SYS+" Standard-Stadt: "+(S("city")||"unbekannt")+"."}]},contents:history.slice(-24),tools:[{functionDeclarations:decl}]})});
      const j=await r.json();if(!r.ok)throw new Error(j.error?.message||"API-Fehler");
      const parts=j.candidates?.[0]?.content?.parts||[];history.push({role:"model",parts});
      const calls=parts.filter(p=>p.functionCall);
      if(!calls.length){const a=parts.map(p=>p.text||"").join("").trim()||"Dazu habe ich keine Antwort.";add("j",a);await speak(a);return}
      const out=[];for(const c of calls){tool(c.functionCall.name);let res;try{res=await impl[c.functionCall.name](c.functionCall.args||{})}catch(e){res={fehler:String(e.message)}}
        out.push({functionResponse:{name:c.functionCall.name,response:res}})}
      history.push({role:"user",parts:out});
    }
  }catch(e){add("j","Fehler: "+e.message);setState("idle")}
}

/* ---------- Einstellungen ---------- */
$("cfg").onclick=()=>{$("key").value=S("key");$("model").value=S("model")||"gemini-2.5-flash";$("city").value=S("city");$("dlg").showModal()};
$("save").onclick=()=>{W("key",$("key").value.trim());W("model",$("model").value.trim());W("city",$("city").value.trim());$("dlg").close()};
$("clr").onclick=()=>{history=[];$("log").innerHTML="";$("dlg").close()};
speechSynthesis.getVoices();
add("j","Guten Tag. JARVIS ist einsatzbereit. Tippe auf den Orb und sprich mit mir.");
</script>
</body>
</html>
